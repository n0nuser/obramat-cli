name: pages

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: actions/configure-pages@v5
      - run: make docs
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - name: static export has the pages and the search index
        working-directory: docs-site
        run: |
          test -s out/docs/index.html
          test -s out/docs/reference/search/index.html
          test -s out/api/search
          test -s out/llms.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
