name: verify release

# Installs a published release the two documented ways, on every OS, and
# checks the installed binary reports that version.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: published tag, for example v0.1.0
        required: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: download, verify checksum, run
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "$RUNNER_OS" in
            Linux) os=linux; ext=tar.gz ;;
            macOS) os=darwin; ext=tar.gz ;;
            Windows) os=windows; ext=zip ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          name="obramat_${version}_${os}_${arch}.${ext}"
          gh release download "$TAG" --repo n0nuser/obramat-cli --pattern "$name" --pattern checksums.txt
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          grep " $name\$" checksums.txt | $sum -c -
          if [ "$ext" = zip ]; then unzip -q "$name"; bin=./obramat.exe; else tar xzf "$name"; bin=./obramat; fi
          test "$($bin --version)" = "obramat $version"

  go-install:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: |
          go install "github.com/n0nuser/obramat-cli/cmd/obramat@$TAG"
          test "$("$(go env GOPATH)/bin/obramat" --version)" = "obramat ${TAG#v}"
