name: obramat.es changed
description: The CLI said the site answered with something it does not understand (exit code 7)
title: "[api change] "
labels: [api-change]
body:
  - type: markdown
    attributes:
      value: |
        The CLI filled in most fields from the request that failed. It never includes your search terms, product references or store; add them below only if you want to.
  - type: input
    id: version
    attributes:
      label: CLI version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / architecture
  - type: input
    id: command
    attributes:
      label: Command (without its arguments)
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
  - type: input
    id: status
    attributes:
      label: HTTP status
  - type: textarea
    id: body_excerpt
    attributes:
      label: Start of the response
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Output of `obramat doctor`, or of the failing command with `--debug`.
