version: 2

project_name: obramat

before:
  hooks:
    - go mod tidy

builds:
  - id: obramat
    # cmd/obramat, so `go install .../cmd/obramat@latest` names the binary obramat.
    main: ./cmd/obramat
    binary: obramat
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  github:
    owner: n0nuser
    name: obramat-cli
  draft: false
  prerelease: auto
